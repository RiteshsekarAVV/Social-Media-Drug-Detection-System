<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💊 Drug Trafficking Detection System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-top: 10px;
        }
        .header {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 15px 30px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        .header img {
            height: 80px;
            width: auto;
            object-fit: contain;
        }
        .header-title {
            font-size: 2em;
            font-weight: 700;
            color: #333;
            margin: 0;
            flex: 1;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
        }
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            min-height: 150px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        .result.suspicious {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
        }
        .result.safe {
            background: #efe;
            border: 2px solid #cfc;
            color: #3c3;
        }
        .result h3 {
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        .result p {
            margin: 10px 0;
            font-size: 1.1em;
        }
        .keywords {
            background: white;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            display: inline-block;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header class="header">
        <img src="{{ url_for('static', filename='KSI.png') }}" alt="KSI Logo">
        <h2 class="header-title">Project Demonstration</h2>
    </header>
    <div class="container">
        <h1>💊 Drug Trafficking Detection System</h1>
        <p class="subtitle">This system analyzes public messages or texts for possible drug-related content.</p>

        <form id="detectionForm">
            <div class="form-group">
                <label for="message">Enter message or post text:</label>
                <textarea id="message" name="message" placeholder="Enter text to analyze..." required></textarea>
            </div>
            <button type="submit">Analyze Message</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing...</p>
        </div>

        <div class="result" id="result">
            <h3 id="resultTitle"></h3>
            <div id="resultContent"></div>
            <button id="pdfButton" style="display: none; margin-top: 15px;" onclick="generatePDF()">Generate Forensic Report (PDF)</button>
        </div>
    </div>

    <script>
        let currentText = '';
        let currentResult = null;

        document.getElementById('detectionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            currentText = document.getElementById('message').value;
            
            if (!currentText.trim()) {
                alert('Please enter a message first.');
                return;
            }

            const resultDiv = document.getElementById('result');
            const loadingDiv = document.getElementById('loading');
            const pdfButton = document.getElementById('pdfButton');

            resultDiv.style.display = 'none';
            loadingDiv.style.display = 'block';
            pdfButton.style.display = 'none';

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: currentText })
                });

                const result = await response.json();
                currentResult = result;

                loadingDiv.style.display = 'none';
                resultDiv.style.display = 'block';

                if (result.status === 'Suspicious') {
                    resultDiv.className = 'result suspicious';
                    document.getElementById('resultTitle').textContent = '🚨 Suspicious Content Detected!';
                    document.getElementById('resultContent').innerHTML = `
                        <p><strong>Detected Keywords:</strong> <span class="keywords">${result.keywords.join(', ')}</span></p>
                    `;
                    pdfButton.style.display = 'block';
                } else {
                    resultDiv.className = 'result safe';
                    document.getElementById('resultTitle').textContent = '✅ No suspicious content detected.';
                    document.getElementById('resultContent').innerHTML = '<p>The message appears to be safe.</p>';
                    pdfButton.style.display = 'none';
                }
            } catch (error) {
                loadingDiv.style.display = 'none';
                alert('Error analyzing message: ' + error.message);
            }
        });

        async function generatePDF() {
            try {
                const response = await fetch('/generate_pdf', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        text: currentText,
                        result: currentResult
                    })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'Forensic_Report.pdf';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    alert('✅ Report generated successfully!');
                } else {
                    alert('Error generating PDF');
                }
            } catch (error) {
                alert('Error generating PDF: ' + error.message);
            }
        }
    </script>
</body>
</html>
